server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Imagens estáticas em public/assets/images (satélite, logos etc.) não
    # têm hash no nome e podem mudar de conteúdo em um novo deploy mantendo
    # o mesmo nome de arquivo — precisam revalidar a cada carregamento em
    # vez de ficar em cache "para sempre", senão navegadores que já
    # visitaram o site ficam presos numa versão antiga da imagem.
    location /assets/images/ {
        add_header Cache-Control "no-cache";
    }

    # Demais assets com hash no nome (build do Vite) podem ser cacheados
    # por muito tempo, já que qualquer mudança gera um nome de arquivo novo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html (fallback para recarregamento direto).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
